<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      body {
        align-items: center;
        background: var(--vscode-editor-background);
        color: var(--vscode-editor-foreground);
        display: flex;
        font-family: var(--vscode-font-family);
        height: 100vh;
        justify-content: center;
        margin: 0;
        padding: 0 1rem;
      }

      main {
        max-width: 28rem;
        text-align: center;
      }

      h1 {
        font-size: 1rem;
        font-weight: 600;
        margin: 0 0 0.5rem;
      }

      p {
        color: var(--vscode-descriptionForeground);
        margin: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Sidebar chat is closed</h1>
      <p>Use the sidebar chat command to reopen it.</p>
    </main>
  </body>
</html>
